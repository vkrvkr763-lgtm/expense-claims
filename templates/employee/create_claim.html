{% extends "base.html" %}

{% block content %}

<h2>Create Expense Claim</h2>

<p class="text-muted">
    Paste your receipt text below. AI will extract the details for you.
</p>


<div class="card shadow-sm p-4 mb-4">

    <label class="form-label">
        Receipt Text
    </label>

    <textarea
        id="receiptText"
        class="form-control"
        rows="7"
        placeholder="Example:

Swiggy
Dinner order
Date: 2026-09-03
Total: ₹850"></textarea>

    <button
        type="button"
        onclick="extractReceipt()"
        class="btn btn-dark mt-3">

        ✨ Extract with AI

    </button>

    <div id="extractMessage"
         class="mt-2">
    </div>

</div>


<form method="POST"
      enctype="multipart/form-data">

    <div class="card shadow-sm p-4">

        <h5 class="mb-4">
            Review Expense
        </h5>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Amount (INR)
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="amount"
                    id="amount"
                    class="form-control"
                    required>

            </div>


            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Expense Date
                </label>

                <input
                    type="date"
                    name="expense_date"
                    id="expense_date"
                    class="form-control"
                    required>

            </div>


            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Merchant
                </label>

                <input
                    type="text"
                    name="merchant"
                    id="merchant"
                    class="form-control"
                    required>

            </div>


            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Category
                </label>

                <select
                    name="category"
                    id="category"
                    class="form-select">

                    <option>Travel</option>
                    <option>Meals</option>
                    <option>Supplies</option>
                    <option>Taxi</option>
                    <option>Other</option>

                </select>

            </div>


            <div class="col-12 mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea
                    name="description"
                    id="description"
                    class="form-control"
                    rows="4"></textarea>

            </div>


            <div class="col-12 mb-3">

                <label class="form-label">
                    Receipt Image
                </label>

                <input
                    type="file"
                    name="receipt"
                    class="form-control"
                    accept="image/*,.pdf">

            </div>

        </div>


        <button
            type="submit"
            class="btn btn-success">

            Submit Claim

        </button>

        <a
            href="{{ url_for('employee_dashboard') }}"
            class="btn btn-secondary">

            Cancel

        </a>

    </div>

</form>


<script>

async function extractReceipt() {

    const text =
        document.getElementById("receiptText").value;

    const message =
        document.getElementById("extractMessage");

    if (!text.trim()) {

        message.innerHTML =
            '<div class="alert alert-warning">Paste receipt text first.</div>';

        return;
    }

    message.innerHTML =
        '<div class="alert alert-info">Extracting...</div>';

    try {

        const response = await fetch(
            "{{ url_for('claim.extract') }}",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    text: text
                })
            }
        );

        const data = await response.json();

        document.getElementById("amount").value =
            data.amount || "";

        document.getElementById("expense_date").value =
            data.expense_date || "";

        document.getElementById("merchant").value =
            data.merchant || "";

        document.getElementById("category").value =
            data.category || "Other";

        document.getElementById("description").value =
            data.description || text;

        message.innerHTML =
            '<div class="alert alert-success">Details extracted. Please review and correct them before submitting.</div>';

    } catch (error) {

        message.innerHTML =
            '<div class="alert alert-danger">Extraction failed.</div>';

    }

}

</script>

{% endblock %}
