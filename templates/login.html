<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Login - Expense Claims</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h3 class="text-center mb-4">
                        Expense Claims
                    </h3>

                    <p class="text-center text-muted">
                        Sign in to continue
                    </p>

                    {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                    {% endif %}

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-dark w-100">

                            Login

                        </button>

                    </form>

                    <hr>

                    <small class="text-muted">

                        Employee:
                        employee@expenseapp.com

                        <br>

                        Manager:
                        manager@expenseapp.com

                        <br>

                        Finance:
                        finance@expenseapp.com

                    </small>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
